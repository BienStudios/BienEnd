# -------------------------------------------------------------
# Spring Boot Application Properties
# -------------------------------------------------------------
spring.application.name=enterprise
server.port=8080

# -------------------------------------------------------------
# PostgreSQL Database Configuration
# -------------------------------------------------------------
spring.datasource.url=${POSTGRES_ENTERPRISE_URL}
spring.datasource.username=${POSTGRES_ENTERPRISE_USERNAME}
spring.datasource.password=${POSTGRES_ENTERPRISE_PASSWORD}

# -------------------------------------------------------------
# JPA / HIBERNATE
# -------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# -------------------------------------------------------------
# CONFIGURACIÓN DE GOOGLE (Spring autoconfigura sus URIs)
# -------------------------------------------------------------
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# -------------------------------------------------------------
# CONFIGURACIÓN DE MICROSOFT (Azure AD / Entra ID)
# -------------------------------------------------------------
spring.security.oauth2.client.registration.microsoft.client-id=${MICROSOFT_CLIENT_ID}
spring.security.oauth2.client.registration.microsoft.client-secret=${MICROSOFT_CLIENT_SECRET}
spring.security.oauth2.client.registration.microsoft.scope=openid,profile,email
spring.security.oauth2.client.registration.microsoft.provider=microsoft

# -------------------------------------------------------------
# Configuración de URIs para Microsoft (Azure AD / Entra ID)
# -------------------------------------------------------------
spring.security.oauth2.client.provider.microsoft.authorization-uri=https://login.microsoftonline.com/${MICROSOFT_TENANT_ID}/oauth2/v2.0/authorize
spring.security.oauth2.client.provider.microsoft.token-uri=https://login.microsoftonline.com/${MICROSOFT_TENANT_ID}/oauth2/v2.0/token
spring.security.oauth2.client.provider.microsoft.jwk-set-uri=https://login.microsoftonline.com/${MICROSOFT_TENANT_ID}/discovery/v2.0/keys
spring.security.oauth2.client.provider.microsoft.user-info-uri=https://graph.microsoft.com/oidc/userinfo
